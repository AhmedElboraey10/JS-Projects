<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Product Tracker</title>
</head>

<body>
    <div class="container">
        <h1 id="title">اضف منتج جديد</h1>
        <div class="inputs">
            <input type="text" id="name" placeholder="اسم المنتج">
            <input type="number" id="price" placeholder="سعر المنتج">
            <button id="add" class="add">اضافه +</button>
            <button id="approveEdit" class="approveEdit" style="display: none;">تعديل <i class="fa-solid fa-pen-to-square"></i></button>
        </div>
        <h1>قائمة المنتجات</h1>
        <div class="productList" id="productList"></div>
        <div class="totalCost"><span id="totalCost"></span> جنية</div>
    </div>
</body>
<script src="main.js"></script>

</html>
