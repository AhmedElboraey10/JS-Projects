<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Color Prefrence App</title>
</head>
<body>
    <div class="container">
        <h1>مُحدد ألوان الخلفية</h1>
        <div class="controllers">
            <div class="colors">
                <button id="red" data-color="red">احمر</button>
                <button id="yellow" data-color="yellow">اصفر</button>
                <button id="green" data-color="green">اخضر</button>
            </div>
            <button id="reset">اعاده الضبط</button>
        </div>
        <p>استمتع بتجربة تغيير الألوان</p>
    </div>
</body>
<script src="main.js"></script>
</html>
