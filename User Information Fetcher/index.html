<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <title>User Information Fetcher</title>
</head>

<body>
    <div class="container">

        <h1 id="title">بيانات المستخدمين</h1>

        <div class="searchContainer">
            <button id="search" class="search">بحث <i class="fa-solid fa-magnifying-glass"></i></button>
            <input type="text" placeholder="اسم المستخدم" id="name">
        </div>

        <table class="userList" id="userList">
            <thead>
                <tr>
                    <th>اسم المستخدم</th>
                    <th>البريد الالكتروني</th>
                    <th>العنوان</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    
    <script src="main.js"></script>
</body>
</html>
