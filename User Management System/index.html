<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <title>User Management System</title>
</head>

<body>
    <div class="container">
        <h1 id="title">اضف مستخدم جديد</h1>
        <div class="inputs">
            <input type="text" id="name" placeholder="اسم المستخدم">
            <input type="number" id="age" placeholder="عمر المستخدم">
            <input type="email" id="email" placeholder="البريد الالكتروني">
            <button id="add" class="add">اضافه +</button>
            <button id="approveEdit" class="approveEdit" style="display: none;">تعديل <i class="fa-solid fa-pen-to-square"></i></button>
        </div>
        
        <h1>قائمة المستخدمين</h1>
        
        <table class="userList" id="userList">
            <thead>
                <tr>
                    <th>اسم المستخدم</th>
                    <th>عمر المستخدم</th>
                    <th>البريد الالكتروني</th>
                    <th>الإجراءات</th>
                </tr>
            </thead>
            <tbody>
                <tr class="user">
                    <td>
                        <p class="name">احمد علي محمد ابراهيم السيد</p>
                    </td>
                    <td>
                        <p class="age"><span>35</span> سنه</p>
                    </td>
                    <td>
                        <p class="email">ahmedali@gmail.com</p>
                    </td>
                    <td>
                        <div class="Buttons">
                            <button class="delete">حذف</button>
                            <a href="#title" class="edit">تعديل</a>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    
    <script src="main.js"></script>
</body>
</html>
