<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculatro</title>
</head>
<body>
    <form>
        <div class="inputs">
            <input type="number" id="num-1" class="input" placeholder="الرقم الاول">
            <input type="number" id="num-2" class="input" placeholder="الرقم التاني">
        </div>
        <div class="operations">
            <button value= '+' >+ جمع</button>
            <button value= '-' >- طرح</button>
            <button value= '*' >x ضرب</button>
            <button value= '/' >/ قسمه</button>
        </div>
        <h1></h1>
    </form>
</body>
<script src="main.js"></script>
</html>
